spring:
  application:
    name: audiogpt
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:8b

      embedding:
        model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true

  datasource:
    url: jdbc:postgresql://localhost:5433/audiogpt
    username: postgres
    password: root123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect


logging:
  level:
    root: INFO
    com.koushik.audiogpt: DEBUG